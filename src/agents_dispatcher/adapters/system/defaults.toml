# Shipped defaults of the M1 settings subset (architecture draft 4, section 3.2).
# This file is the single place where a default value is written. A user file at
# <account home>/.config/agents-dispatcher/settings.toml overrides single keys.
# Location values are absolute paths or start with one of the tokens @account-home,
# @account-config, @account-state or @state (the resolved store.path).

schema_version = 1

[store]
path = "@account-state/agents-dispatcher"

[run_area]
path = "@state/runs"

[resources.run]
memory_bytes = 2147483648

# The hard deadline is generous on purpose: no probe measured the duration of long review runs.
[watchdog]
hard_s = "14400"
term_grace_s = "10"
kill_wait_s = "2"
scan_s = "1"
# How long `start` waits for the supervisor to take over a run before it ends it as LAUNCH_LOST.
startup_s = "30"

# Process observation of a run (O1 layer 3). `watchdog.scan_s` is how often the watchdog loop
# wakes; the process look below runs on its own clock and only when the loop is awake.
[process.observation]
process_interval_s = "1"
process_max_age_s = "2"
path_interval_s = "2"
path_max_age_s = "5"
empty_rounds = 2
cleanup_rounds = 8

[public]
reason_bytes = 512
summary_bytes = 1024

# The longest task text `start` and `run` accept, in UTF-8 bytes (ARCH L3573).
[security]
input_bytes = 1048576
# Write task types that may run (ARCH L3565); any other write task type is refused before a run.
allow_write_tasks = ["implement"]

[logging]
directory = "@state/logs"

[storage]
sqlite_busy_s = "2"

# The confined account inspector (login status commands): how long and how much it may use.
[inspector]
timeout_s = "20"
memory_bytes = 1073741824

# The MCP server (`agentsd mcp serve`): read once when the server starts.
[mcp]
transport = "own"
initialize_timeout_s = "10"
partial_frame_timeout_s = "5"
write_timeout_s = "2"
shutdown_drain_s = "2"
shutdown_total_s = "5"
priority_burst = 8
wait_max_s = "20"

[mcp.frame]
in_bytes = 8388608
out_bytes = 4194304
depth = 32
nodes = 100000
numeric_token_bytes = 128

[mcp.ids]
maximum = 65536
string_bytes = 128

[mcp.normal]
workers = 6
queue = 12

[mcp.control]
workers = 1
queue = 4

[mcp.input]
aggregate_bytes = 33554432

[proxy]
ports = [443]
allow_nonpublic = false
header_bytes = 16384
connections = 32
buffer_bytes = 1048576
idle_s = "60"
lifetime_s = "1800"
connect_s = "10"

[proxy.providers.anthropic]
hosts = ["api.anthropic.com"]

[proxy.providers.openai]
hosts = ["chatgpt.com"]

# Selectors expand to the inventories below and to the run-specific areas of the SDK.
[sandbox]
read_deny = ["@sensitive-user-data", "@other-vendor-state", "@sdk-control", "@other-runs"]
# ~/Library/Keychains is deliberately absent: denying it breaks the worker's own login.
sensitive_user_data = [
    "@account-home/.ssh",
    "@account-home/.aws",
    "@account-home/.gnupg",
    "@account-home/.azure",
    "@account-home/.kube",
    "@account-home/.docker",
    "@account-home/.netrc",
    "@account-home/.config/gcloud",
    "@account-home/.config/gh",
    "@account-home/Library/Mail",
    "@account-home/Library/Messages",
    "@account-home/Library/Safari",
    "@account-home/Library/Cookies",
    "@account-home/Library/Application Support/Google/Chrome",
    "@account-home/Library/Application Support/Firefox",
]
# Tools that no provider here uses stay denied to every worker.
other_vendor_state = [
    "@account-home/.cursor",
    "@account-home/.gemini",
    "@account-home/.config/github-copilot",
]

# Login state of each provider's own tool: denied to every other provider's worker, readable by its own.
[sandbox.vendor_state]
anthropic = ["@account-home/.claude", "@account-home/.claude.json"]
openai = ["@account-home/.codex"]

# What a task is when no task type is named, and the advice a handoff carries (ARCH L3532-L3535).
[defaults]
mode = "read"
# Providers in order, at most one link each; a terminal handoff hands the task back as advice.
chain = [{ provider = "openai" }, { provider = "anthropic" }, { handoff = true }]
recommendation_model = "gpt-6.1-sol"
recommendation_effort = "medium"
# Quota admission (ARCH L3542-L3544): best_effort admits when the evidence is missing, required does not.
quota_mode = "best_effort"
quota_reserve_percent = 15
quota_max_age_s = "30"

# Task types (ARCH L3546-L3547). A user file may add more; each needs a mode.
[tasks.audit]
mode = "read"

[tasks.implement]
mode = "write"

[profiles._template]
executable = "auto"
# Only the registered "auto" template exists in this version (ARCH L3558).
invocation_read = "auto"
invocation_write = "auto"

# The quota bucket a profile reads (ARCH L3562).
[profiles.openai.main]
bound_bucket = "codex"

# Providers (ARCH L3549-L3556). The model of anthropic is the owner's choice of 2026-11-13; effort is
# one of the levels `claude --help` documents. A provider that is not declared here cannot be added.
[providers._template]
enabled = true
effort = "medium"
# Non-terminal runs one provider may hold at once (owner decision O2).
capacity = 5

[providers.openai]
implementation = "builtin.codex"
model = "gpt-6.1-sol"

[providers.anthropic]
implementation = "builtin.claude"
model = "claude-sonnet-5-5"
